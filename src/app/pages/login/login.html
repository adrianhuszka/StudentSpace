<div class="h-screen w-screen flex justify-center items-center p-4">
  <div class="login-container w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-white mb-2 !text-white">Welcome to EduCloud</h1>
      <p class="text-gray-200 text-opacity-80">Sign in or create your account</p>
    </div>

    <!-- Display error message from auth service -->
    @if (authService.errorMessage()) {
    <nz-alert
      class="mb-4"
      nzType="error"
      [nzMessage]="authService.errorMessage()"
      nzShowIcon
      nzCloseable
      (nzOnClose)="authService.errorMessage.set(null)"
    ></nz-alert>
    }

    <nz-tabset nzCentered class="auth-tabs">
      <nz-tab nzTitle="Login">
        <form nz-form [formGroup]="validateForm" class="login-form" (ngSubmit)="submitForm()">
          <nz-form-item class="w-full">
            <nz-form-control [nzErrorTip]="getUsernameErrorMessage()">
              <nz-input-group nzPrefixIcon="user">
                <input
                  type="text"
                  nz-input
                  formControlName="username"
                  placeholder="Username"
                  (input)="validateForm.get('username')?.updateValueAndValidity()"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>
          <nz-form-item class="w-full">
            <nz-form-control [nzErrorTip]="getPasswordErrorMessage()">
              <nz-input-group nzPrefixIcon="lock">
                <input
                  type="password"
                  nz-input
                  formControlName="password"
                  placeholder="Password"
                  (input)="validateForm.get('password')?.updateValueAndValidity()"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>
          <div nz-row class="mb-4">
            <div nz-col [nzSpan]="12">
              <label nz-checkbox formControlName="remember">
                <span>Remember me</span>
              </label>
            </div>
            <div nz-col [nzSpan]="12">
              <a class="float-right">Forgot password</a>
            </div>
          </div>
          <button
            nz-button
            class="w-full login-button"
            [nzType]="'primary'"
            [nzLoading]="authService.isLoading()"
            [disabled]="authService.isLoading()"
          >
            Log in
          </button>
        </form>
      </nz-tab>

      <nz-tab nzTitle="Register">
        <form nz-form class="login-form">
          <nz-form-item class="w-full">
            <nz-form-control>
              <nz-input-group nzPrefixIcon="user">
                <input type="text" nz-input placeholder="Username" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="w-full">
            <nz-form-control>
              <nz-input-group nzPrefixIcon="mail">
                <input type="email" nz-input placeholder="Email" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="w-full">
            <nz-form-control>
              <nz-input-group nzPrefixIcon="lock">
                <input type="password" nz-input placeholder="Password" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="w-full">
            <nz-form-control>
              <nz-input-group nzPrefixIcon="lock">
                <input type="password" nz-input placeholder="Confirm Password" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <button nz-button class="w-full login-button" [nzType]="'primary'">Create Account</button>
        </form>
      </nz-tab>
    </nz-tabset>
  </div>
</div>
