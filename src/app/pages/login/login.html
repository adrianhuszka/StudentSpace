<div class="h-screen w-screen flex justify-center items-center p-4">
  <div class="login-container w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-white mb-2 !text-white">StudentSpace</h1>
      <p class="text-gray-200 text-opacity-80">Jelentkezz be, vagy hozd létre a fiókodat</p>
    </div>

    <!-- Display error message from auth service -->
    @if (authService.errorMessage()) {
      <nz-alert
        class="mb-4"
        nzType="error"
        [nzMessage]="authService.errorMessage()"
        nzShowIcon
        nzCloseable
        (nzOnClose)="authService.errorMessage.set(null)"
      ></nz-alert>
    }

    <nz-tabset nzCentered class="auth-tabs">
      <nz-tab nzTitle="Bejelentkezés">
        <form nz-form [formGroup]="validateForm" class="login-form" (ngSubmit)="submitForm()">
          <nz-form-item class="w-full">
            <nz-form-control [nzErrorTip]="getUsernameErrorMessage()">
              <nz-input-group nzPrefixIcon="user">
                <input
                  type="text"
                  nz-input
                  formControlName="username"
                  placeholder="Felhasználónév"
                  (input)="validateForm.get('username')?.updateValueAndValidity()"
                  style="border-radius: 5px; padding: 5px"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>
          <nz-form-item class="w-full">
            <nz-form-control [nzErrorTip]="getPasswordErrorMessage()">
              <nz-input-group nzPrefixIcon="lock">
                <input
                  type="password"
                  nz-input
                  formControlName="password"
                  placeholder="Jelszó"
                  style="border-radius: 5px; padding: 5px"
                  (input)="validateForm.get('password')?.updateValueAndValidity()"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>
          <div nz-row class="mb-4">
            <div nz-col [nzSpan]="12">
              <label nz-checkbox formControlName="remember">
                <span>Emlékezz rám</span>
              </label>
            </div>
            <div nz-col [nzSpan]="12">
              <a class="float-right" [routerLink]="['/forgot-password']">Elfelejtett jelszó</a>
            </div>
          </div>
          <button
            nz-button
            class="w-full login-button"
            [nzType]="'primary'"
            [nzLoading]="authService.isLoading()"
            [disabled]="authService.isLoading()"
          >
            Bejelentkezés
          </button>

          <button
            nz-button
            class="w-full mt-3"
            [nzType]="'default'"
            type="button"
            (click)="onKeycloakLogin()"
            disabled
          >
            Bejelentkezés Keycloakkal (hamarosan)
          </button>
        </form>
      </nz-tab>

      <nz-tab nzTitle="Regisztráció">
        <form
          nz-form
          class="login-form"
          [formGroup]="registerForm"
          (ngSubmit)="submitRegisterForm()"
        >
          <nz-form-item class="w-full">
            <nz-form-control>
              <nz-input-group nzPrefixIcon="user">
                <input
                  type="text"
                  nz-input
                  formControlName="username"
                  placeholder="Felhasználónév"
                  style="border-radius: 5px; padding: 5px"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="w-full">
            <nz-form-control>
              <nz-input-group nzPrefixIcon="mail">
                <input
                  type="email"
                  nz-input
                  formControlName="email"
                  placeholder="E-mail"
                  style="border-radius: 5px; padding: 5px"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="w-full">
            <nz-form-control>
              <nz-input-group nzPrefixIcon="lock">
                <input
                  type="password"
                  nz-input
                  formControlName="password"
                  placeholder="Jelszó"
                  style="border-radius: 5px; padding: 5px"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="w-full">
            <nz-form-control>
              <nz-input-group nzPrefixIcon="lock">
                <input
                  type="password"
                  nz-input
                  formControlName="confirmPassword"
                  placeholder="Jelszó megerősítése"
                  style="border-radius: 5px; padding: 5px"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <button
            nz-button
            class="w-full login-button"
            [nzType]="'primary'"
            [nzLoading]="authService.isLoading()"
            [disabled]="authService.isLoading()"
          >
            Fiók létrehozása
          </button>
        </form>
      </nz-tab>
    </nz-tabset>
  </div>
</div>
