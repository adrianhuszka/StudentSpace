<nz-badge [nzDot]="isNewMessage">
  <i
    nz-icon
    nzType="mail"
    nzTheme="outline"
    class="cursor-pointer text-[1.5rem] !text-white"
    (click)="log('click mail')"
  ></i>
</nz-badge>
<nz-avatar
  nzText="{{ userName.charAt(0).toUpperCase() }}"
  nz-dropdown
  [nzDropdownMenu]="menu"
  class="cursor-pointer"
></nz-avatar>
<nz-dropdown-menu #menu="nzDropdownMenu">
  <ul nz-menu>
    <li>@{{ userName }}</li>
    <li nz-menu-divider></li>
    <li nz-menu-item routerLink="/profile">
      <i nz-icon nzType="user" nzTheme="outline"></i> Profil
    </li>
    <li nz-menu-item routerLink="/settings">
      <i nz-icon nzType="setting" nzTheme="outline"></i> Beállítások
    </li>
    @if (isAdmin) {
      <li nz-menu-divider></li>
      <li nz-menu-item routerLink="/admin">
        <i nz-icon nzType="dashboard" nzTheme="outline"></i> Admin irányítópult
      </li>
    }
    <li nz-menu-divider></li>
    <li nz-menu-item class="!text-red-600" (click)="logout()">
      <i nz-icon nzType="logout" nzTheme="outline"></i> Kijelentkezés
    </li>
  </ul>
</nz-dropdown-menu>
